[workspace]
resolver = "2"
members = [
    "crates/coast",
    "crates/terminal-core",
    "crates/themes",
    "crates/settings",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
