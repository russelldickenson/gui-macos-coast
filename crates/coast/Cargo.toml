[package]
name = "coast"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "coast"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
alacritty_terminal = "0.26"
core-foundation = "0.10"
core-text = "21"
terminal-core = { path = "../terminal-core" }
coast-themes = { path = "../themes" }
coast-settings = { path = "../settings" }
anyhow.workspace = true
toml.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColorPanel", "NSColor", "NSColorSpace", "NSWindow", "NSPanel", "NSResponder"] }
